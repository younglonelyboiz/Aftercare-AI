version: "1.0.0"
updated_at: "2026-11-13"
description: >
  Bộ quy tắc chính sách an toàn đầu ra (L5 Output Guardrails) cho trợ lý y tế Aftercare-AI.
  Kiểm duyệt toàn bộ văn bản do mô hình ngôn ngữ lớn sinh ra trước khi trả về cho bệnh nhân,
  bao gồm 9 quy tắc bắt buộc theo Mục 4.6 của tài liệu thiết kế.

medical_disclaimer: "Lưu ý y tế: Thông tin chỉ mang tính hỗ trợ giáo dục sức khỏe, không thay thế chẩn đoán hoặc chỉ định của bác sĩ điều trị."

# Danh mục tên thuốc/hoạt chất cần kiểm soát chặt chẽ bởi quy tắc OUT-MED-ALLOW:
# Nếu câu trả lời của LLM nhắc tới bất kỳ thuốc nào trong danh mục này mà thuốc đó KHÔNG xuất hiện
# trong đoạn tài liệu truy xuất (retrieved_chunks), hồ sơ bệnh nhân (profile) hoặc câu hỏi của người bệnh,
# đầu ra sẽ bị chặn (FAIL -> Safe Fallback).
